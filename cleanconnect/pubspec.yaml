name: cleanconnect
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.1.0

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  path: ^1.9.0

  # Networking
  dio: ^5.4.1
  dio_smart_retry: ^7.0.1
  connectivity_plus: ^7.0.0
  pretty_dio_logger: ^1.4.0   # ✅ USE THIS ONLY

  # Authentication
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  jwt_decoder: ^2.0.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

  # Media
  flutter_image_compress: ^2.2.0
  video_compress: ^3.1.3
  image_picker: ^1.1.2        # ✅ UPDATED
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  video_thumbnail: ^0.5.6     # ✅ UPDATED
  flutter_svg: ^2.0.10+1

  # Real-time
  web_socket_channel: ^3.0.3
  ambient_light: ^0.1.4

  # Utilities
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  either_dart: ^1.0.0
  uuid: ^4.3.3
  intl: ^0.20.2
  equatable: ^2.0.7
  dartz: ^0.10.1

  # Background Tasks
  workmanager: ^0.9.0+3

  # Permissions
  permission_handler: ^12.0.1

  local_auth: ^2.3.0

  # Splash Screen
  flutter_native_splash: ^2.4.7

  equatable: ^2.0.7
  dartz: ^0.10.1
  dio_log: ^5.3.0+3
  pretty_dio_logger: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

  # Testing
  mocktail: ^1.0.3
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/

  fonts:
    - family: OpenSans-Bold
      fonts:
        - asset: assets/fonts/OpenSans-Bold.ttf

    - family: OpenSans-Italic
      fonts:
        - asset: assets/fonts/OpenSans-Italic.ttf

    - family: OpenSans-Regular
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/image1.jpg
  android: true
  ios: true
  web: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/clean_connet.ico
  remove_alpha_ios: true
